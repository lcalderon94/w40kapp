# Construye el APK instalable.
#
# Va aquí y no en la máquina de desarrollo porque los datos que la app empaqueta se generan: el
# repositorio guarda los JSON originales de BSData y las traducciones, y el pipeline los junta.
# Así el APK que sale de aquí siempre lleva la traducción del commit que lo produjo.
name: APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  # El motor es Dart puro y no necesita ni Flutter ni el SDK de Android. Se prueba aparte para que
  # un fallo suyo se vea en dos minutos en vez de después de instalar medio gigabyte de cosas.
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # El pipeline de traducción es Java, y sin él las pruebas leen los JSON originales en inglés
      # y fallan las que comprueban que el texto llega traducido.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generar el dataset en español
        run: ./tool/preparar-datos.sh

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - working-directory: core
        run: |
          dart pub get
          dart analyze
          dart test

  apk:
    runs-on: ubuntu-latest
    # Sin esto, un paso colgado se come seis horas de runner antes de rendirse. La instalación de
    # Flutter se quedó parada en el primer intento y no había forma de enterarse.
    timeout-minutes: 45
    # Para poder publicar el Release con el APK colgado.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable

      - name: Generar el dataset en español
        run: ./tool/preparar-datos.sh

      - name: Pruebas de la app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Construir el APK
        working-directory: app
        run: flutter build apk --release

      # El APK primero, que es lo que se viene a buscar. Lo de abajo es diagnóstico y no debe
      # poder dejarnos sin artefacto si falla.
      - uses: actions/upload-artifact@v4
        with:
          name: warorgan-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Un artefacto está bien para CI, pero para instalar en el móvil es un incordio: hace falta
      # estar logueado, baja un zip y Android no instala zips. Un Release deja el .apk suelto, con
      # un enlace que no cambia nunca y no pide login. Se abre en el móvil y se instala.
      - name: Publicar el APK donde se pueda bajar de un toque
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk warorgan.apk
          # Se borra y se rehace para que la etiqueta apunte siempre al commit recién compilado.
          gh release delete ultima --yes --cleanup-tag 2>/dev/null || true
          gh release create ultima warorgan.apk \
            --title "WarOrgan-ES · última compilación" \
            --notes "APK instalable, compilado de \`${GITHUB_SHA:0:7}\`.

          Descarga directa: **[warorgan.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/ultima/warorgan.apk)**

          Ábrelo desde el móvil y acepta instalar de origen desconocido. Este enlace no cambia: siempre apunta a la última compilación."

      # Con qué clave ha quedado firmado. Si la huella cambia de una compilación a otra, Android
      # se niega a instalar la nueva encima de la vieja y hay que desinstalar, que se lleva por
      # delante las listas guardadas. Así queda por escrito en cada build en vez de suponerlo.
      #
      # Con apksigner y no con keytool: keytool -printcert -jarfile solo sabe leer firmas v1, y
      # un APK de Flutter moderno puede venir firmado solo con v2/v3.
      - name: Con qué clave va firmado
        if: always()
        continue-on-error: true
        run: |
          echo "== dónde busca Gradle la clave de depuración =="
          echo "HOME=$HOME  ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-sin definir}  ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-sin definir}"
          for d in "$HOME/.android" "${ANDROID_SDK_HOME:-/nada}/.android" "${ANDROID_SDK_ROOT:-/nada}/.android"; do
            echo "-- $d"; ls -la "$d" 2>&1 | sed 's/^/   /' || true
          done
          echo
          echo "== huella de la firma del APK =="
          firmador=$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$firmador" ]; then
            "$firmador" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk
          else
            echo "apksigner no encontrado"
          fi
