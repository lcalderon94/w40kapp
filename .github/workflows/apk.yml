# Construye el APK instalable.
#
# Va aquí y no en la máquina de desarrollo porque los datos que la app empaqueta se generan: el
# repositorio guarda los JSON originales de BSData y las traducciones, y el pipeline los junta.
# Así el APK que sale de aquí siempre lleva la traducción del commit que lo produjo.
name: APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  # El motor es Dart puro y no necesita ni Flutter ni el SDK de Android. Se prueba aparte para que
  # un fallo suyo se vea en dos minutos en vez de después de instalar medio gigabyte de cosas.
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # El pipeline de traducción es Java, y sin él las pruebas leen los JSON originales en inglés
      # y fallan las que comprueban que el texto llega traducido.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generar el dataset en español
        run: ./tool/preparar-datos.sh

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - working-directory: core
        run: |
          dart pub get
          dart analyze
          dart test

  apk:
    runs-on: ubuntu-latest
    # Sin esto, un paso colgado se come seis horas de runner antes de rendirse. La instalación de
    # Flutter se quedó parada en el primer intento y no había forma de enterarse.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable

      - name: Generar el dataset en español
        run: ./tool/preparar-datos.sh

      - name: Pruebas de la app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Construir el APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: warorgan-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
